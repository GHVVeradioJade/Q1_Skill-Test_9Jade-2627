<!DOCTYPE html>
<html>
    <head>
        <title>OBMC Robotics Club Application Form</title>
        <link rel="stylesheet" type="text/css" href="styles.css"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Libre+Barcode+39+Extended&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="heading2">OBMC Robotics Club Application Form</div>
        <div> <span>Welcome!</span> Please fill out this form to apply for our school's Robotics Club</div>
<form>
                <textarea rows="2" cols="40" placeholder="Full Name"></textarea><br>
                <input type="submit">
                <label>Age:</label>
                <textarea rows="2" cols="40" placeholder="Email"></textarea><br>
                <input type="submit">
                <label>Age:</label>
                <label>Select your grade level</label><br>
                <select>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select><br>
                <label>Select your section</label><br>
                <input type="radio" name="section" value="Male">
                <label for="#">Emerald</label>
                <input type="radio" name="section" value="Female">
                <label for="#">Ruby</label><br>
                <label>What are your skills?</label>
                <input type="checkbox">
                <label>Design</label>
                <input type="checkbox">
                <label>Coding</label>
                <input type="checkbox">
                <label>Electronics</label><br>
                <div> <span>tell us why you want to join:</span></div>
                <textarea rows="5" cols="45"></textarea><br>
                <input type="submit">
                <div> <span>Top Robotics activities we also offer:</span></div>
                 <div> <span>-Line following Robotics</span></div>
                <div> <span>-Obstacle avoidance Programming</span></div>
                <div> <span>-Light following robot</span></div>
                <div> <span>Helpful Links</span></div>
                <a href="https://robotics.org">Robotics.org<a>
            </form>
    </body>
</html>
